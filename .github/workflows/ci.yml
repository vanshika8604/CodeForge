name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeforge_test
          POSTGRES_PASSWORD: codeforge_test
          POSTGRES_DB: codeforge_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeforge_test -d codeforge_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql://codeforge_test:codeforge_test@localhost:5432/codeforge_test_db?schema=public"
      TEST_DATABASE_URL: "postgresql://codeforge_test:codeforge_test@localhost:5432/codeforge_test_db?schema=public"
      JWT_SECRET: "ci-test-secret"
      JWT_EXPIRES_IN: "7d"
      JUDGE0_API_URL: "https://judge0-ce.p.rapidapi.com"
      JUDGE0_API_KEY: ""
      FRONTEND_URL: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm run test:ci